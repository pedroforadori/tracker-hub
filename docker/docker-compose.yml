services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_pass
      POSTGRES_DB: tracker_hub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
