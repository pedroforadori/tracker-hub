name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker_pass
          POSTGRES_DB: tracker_hub
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tracker:tracker_pass@localhost:5433/tracker_hub
      JWT_SECRET: ci-test-secret
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_PRICE_ID: price_fake
      STRIPE_WEBHOOK_SECRET: whsec_fake
      RESEND_API_KEY: re_fake
      RESEND_FROM: noreply@trackerhub.com.br

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Run all tests
        run: pnpm test:all

  deploy-check:
    name: Vercel Health Check
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for Vercel deployment
        run: sleep 30

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://tracker-hub-api.vercel.app/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Deployment healthy"
